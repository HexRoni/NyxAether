[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nyxaether-android"
version = "1.0.0"
description = "NyxAether dark terminal Android ADB diagnostics suite"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
nyxaether = "astralink.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
